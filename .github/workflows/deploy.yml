name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Stamp footer with deploy time (Europe/Rome)
        run: |
          NOW=$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')
          sed -i -E "s#Last updated [0-9]{2}/[0-9]{2}/[0-9]{4} [0-9]{2}:[0-9]{2}#Last updated $NOW#" src/partials/footer.html
          grep -q "Last updated $NOW" src/partials/footer.html

      - name: Build Vite application
        run: npm run build

      - name: Copy backend assets and config to dist
        run: |
          if [ -f ".htaccess" ]; then
            cp .htaccess dist/
          fi

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: ./dist/
